<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kronosfer - GeoGame</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="intro-layer">
        <div class="rocket-wrapper">
            <img src="roket.png.png" class="rocket-body" alt="Roket">
            <div class="exhaust-fume"></div>
        </div>
    </div>

    <div id="cesiumContainer"></div>

    <div id="ui-layer" class="hidden-initially">
        
        <div id="login-screen" class="screen active">
            <h1 class="game-title">KRONOSFER</h1>
            <p class="game-subtitle">Yörünge Takip Protokolü</p>
            
            <div class="login-box">
                <input type="text" id="usernameInput" placeholder="KOD ADI GİRİNİZ..." autocomplete="off">
                <button id="startBtn">GÖREVE BAŞLA</button>
            </div>

            <div id="high-scores">
                <h3>🏆 SEÇKİN PİLOTLAR</h3>
                <ul id="score-list">
                    <li>Veri Yok...</li>
                </ul>
            </div>
        </div>

        <div id="game-ui" class="screen hidden">
            <div class="info-panel">
                <div class="info-item">Süre: <span id="timer">90</span></div>
                <div class="info-item">Puan: <span id="score">0</span></div>
                <div class="info-item">Can: <span id="lives">❤️❤️❤️</span></div>
            </div>

            <div class="question-panel">
                <h3 id="question-text">Soru Yükleniyor...</h3>
                <div id="options-container"></div>
            </div>
        </div>

        <div id="result-screen" class="screen hidden">
            <h2>OYUN BİTTİ!</h2>
            <p>Toplam Puanın: <span id="final-score">0</span></p>
            <button onclick="location.reload()">TEKRAR OYNA</button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
